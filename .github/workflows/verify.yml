name: Verify extensions

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - 'lib/animecommon/**'
      - 'src/**'
      - 'tools/**'

permissions: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Аудит и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Статический аудит
        run: python3 tools/audit_extensions.py
      - name: Сборка общей библиотеки
        run: ./gradlew :lib:animecommon:assembleDebug --console=plain
